# Optional. Not linked by default: see the note on tmux in the README.
# Enable with:  ./bootstrap.sh --tmux
#
# Deliberately small and plugin free. Ghostty already provides splits, tabs,
# scrollback and copy. What tmux adds is sessions that outlive the terminal,
# which is what this config exists for.

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Splits that open where you already are, and read like what you see.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r m resize-pane -Z

bind r source-file ~/.tmux.conf \; display "reloaded"

# vi copy mode. Yank is y, matching every tutorial and cheatsheet.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
