# Generated by scripts/sync-theme.py from nvim/lua/palette.lua.
# Edit the palette and re-run the script; changes here are overwritten.
# Colours match the Neovim theme: yellow is the accent, red marks unstaged work.
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor: ["#f1c21b", bold]
    inactiveBorderColor: ["#525252"]
    optionsTextColor: ["#78a9ff"]
    selectedLineBgColor: ["#1f1f1f"]
    selectedRangeBgColor: ["#1f1f1f"]
    cherryPickedCommitBgColor: ["#31363b"]
    cherryPickedCommitFgColor: ["#f1c21b"]
    unstagedChangesColor: ["#fa4d56"]
    defaultFgColor: ["#f2f4f8"]
    searchingActiveBorderColor: ["#ff832b"]
  authorColorDefault: "#be95ff"
git:
  paging:
    # delta syntax-highlights the diff so review reads like the editor, not a
    # flat red/green wall. --paging=never lets lazygit own scrolling; single
    # column keeps line-by-line staging (Space in the diff view) working.
    colorArg: always
    pager: delta --dark --paging=never
os:
  editPreset: "nvim"
